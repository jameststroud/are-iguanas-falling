<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night silhouette | Reserve animation</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Reserve animation for areiguanasfalling: black silhouette, sky shifts from dusk to pre-dawn, thermometer bar marked at 44F */
*{box-sizing:border-box;min-width:0}
body{margin:0;font-family:Archivo, sans-serif;background:#f3efe6;color:#121417}
.frame{max-width:960px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;padding:18px 20px 12px}
svg.scene{display:block;width:100%;height:auto}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:16px 20px 24px}
.ctrl label{font-weight:600;font-size:15px}
.ctrl input{flex:1 1 220px;height:44px;accent-color:#121417}
.tv{font-size:28px;font-weight:700;min-width:78px;text-align:right}
button{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid #121417;background:transparent;color:#121417;font:600 15px Archivo, sans-serif;cursor:pointer}
button.solid{background:#121417;color:#f3efe6}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #121417;outline-offset:3px}
a{color:inherit}

.tail{transform-box:fill-box;transform-origin:100% 0;animation:tl 6s ease-in-out infinite}
.torso{transform-box:fill-box;transform-origin:50% 100%;animation:br 3.6s ease-in-out infinite}
.dew{transform-box:fill-box;transform-origin:50% 0;animation:dw 8s ease-in-out infinite}
.lid{opacity:0;animation:bl 5s infinite}
.ig{transform-box:fill-box;transform-origin:50% 50%}
@keyframes tl{50%{transform:rotate(-2.5deg)}}
@keyframes br{50%{transform:scaleY(1.04)}}
@keyframes dw{0%,70%,100%{transform:none}78%,92%{transform:scale(1.1,1.22)}}
@keyframes bl{0%,94%,100%{opacity:0}96.5%{opacity:1}}
.chilly .tail{animation-duration:14s}.chilly .torso{animation-duration:7s}.chilly .dew{animation:none}
.chilly .lid{animation:none;opacity:.65}
.cold .tail,.cold .torso,.cold .dew{animation:none}.cold .lid{animation:none;opacity:1}
.ig.fallA{animation:fA 2.6s cubic-bezier(.4,0,.8,.55) forwards}.ig.fallB{animation:fB 2.6s cubic-bezier(.4,0,.8,.55) forwards}
@keyframes fA{0%,8%{transform:none}16%{transform:rotate(2deg)}24%{transform:translate(0,4px) rotate(-2deg)}34%{transform:translate(6px,14px) rotate(30deg)}74%{transform:translate(-8px,58px) rotate(189deg)}80%{transform:translate(-9px,46px) rotate(186deg)}86%,100%{transform:translate(-10px,56px) rotate(191deg)}}
@keyframes fB{0%,8%{transform:none}16%{transform:rotate(2deg)}24%{transform:translate(0,4px) rotate(-2deg)}34%{transform:translate(6px,14px) rotate(30deg)}74%{transform:translate(-8px,58px) rotate(189deg)}80%{transform:translate(-9px,46px) rotate(186deg)}86%,100%{transform:translate(-10px,56px) rotate(191deg)}}
@media (prefers-reduced-motion:reduce){.tail,.torso,.dew,.lid{animation:none!important}.ig.fallA,.ig.fallB{animation:none;transform:translate(-10px,56px) rotate(191deg)}}

.big{font-size:22px;font-weight:800}.head{transition:background 1.2s}rect,circle{transition:fill 1.2s}
</style>
</head>

<div class="ctrl">
<label for="t">Air temperature</label>
<input id="t" type="range" min="28" max="85" step="1" value="72">
<div class="tv" id="tv">72°F</div>
<button class="solid" id="cold" type="button">Cold front</button>
<button id="warm" type="button">Warm up</button>
<a href="index.html" style="margin-left:auto;font-size:14px">All animations</a>

<script>
{
function colors(temp){const t=(temp-40)/(75-40);const sky=mix('#1d3550','#e8894a',t);const ink='#121417';
 return {sky,orb:temp>55?'#ffd27a':'#e4ecf2',branch:ink,body:ink,dark:ink,limb:ink,belly:ink,crest:ink,dew:ink,head:ink,shield:ink,iris:ink};}
function extra(temp,lvl){const c=colors(temp);$('hd').style.background=c.sky;$('hd').style.color=temp>55?'#121417':'#f3efe6';$('ans').textContent=lvl==='cold'?'YES.':'NO.';
 $('stars').setAttribute('opacity',temp>55?0:.9);$('bar').setAttribute('width',Math.round(400*Math.max(0,Math.min(1,(temp-28)/57))));$('thr').setAttribute('stroke',c.sky);}

const $=id=>document.getElementById(id);
const mix=(a,b,t)=>{t=Math.max(0,Math.min(1,t));const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');};
let drop=0,last=null;
function paint(c){document.querySelectorAll('[data-f]').forEach(e=>{const v=c[e.dataset.f];if(v)e.setAttribute('fill',v)});document.querySelectorAll('[data-s]').forEach(e=>{const v=c[e.dataset.s];if(v)e.setAttribute('stroke',v)});}
function set(temp,replay){
  const lvl=temp<=44?'cold':temp<=55?'chilly':'warm';
  const root=$('root');root.classList.remove('cold','chilly','warm');root.classList.add(lvl);
  const ig=$('ig');
  if(lvl==='cold'&&(last!=='cold'||replay)){drop++;ig.classList.remove('fallA','fallB');void ig.getBoundingClientRect();ig.classList.add(drop%2?'fallA':'fallB');}
  if(lvl!=='cold')ig.classList.remove('fallA','fallB');
  last=lvl;$('t').value=temp;$('tv').textContent=temp+'°F';
  paint(colors(temp,lvl));extra(temp,lvl);
}
$('t').addEventListener('input',e=>set(+e.target.value));
$('cold').addEventListener('click',()=>set(38,true));
$('warm').addEventListener('click',()=>set(72));
set(72);

}
</script>
