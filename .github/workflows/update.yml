name: Update iguana forecast

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at :17 to dodge the top-of-hour rush
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Print the Bluesky post in the log instead of sending it"
        type: boolean
        default: false

permissions:
  contents: write

# Never run two updates at once, so two runs can't push at the same time
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_forecast.py
        env:
          # Add these under Settings > Secrets and variables > Actions. If they
          # are missing, the script simply doesn't post.
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
      - name: Commit if anything changed
        run: |
          git config user.name "iguana-bot"
          git config user.email "iguana-bot@users.noreply.github.com"
          git add status.json og-image.png
          git add falls.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Forecast update"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
