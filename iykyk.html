<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARE IGUANAS FALLING?</title>
<style>
  :root { --sky: #ffffff; --ink: #000000; --no: #0a7a0a; --yes: #d00000; --maybe: #c77700; }
  html, body { margin: 0; background: var(--sky); color: var(--ink); }
  body { font-family: "Times New Roman", Times, serif; text-align: center; overflow-x: hidden; }
  h1 { font-size: clamp(22px, min(5vw, 5.5vh), 54px); margin: 14px 10px 0; }
  #answer { font-size: clamp(64px, min(24vw, 17vh), 280px); font-weight: bold; line-height: 0.95; margin: 4px 0 0; color: var(--no); }
  #answer.yes { color: var(--yes); animation: blink 0.6s steps(2, start) infinite; }
  #answer.maybe { color: var(--maybe); }
  @keyframes blink { to { visibility: hidden; } }
  #say { font-size: clamp(18px, 2.6vw, 26px); margin: 6px 12px 10px; min-height: 1.3em; }
  #controls { margin: 4px 0 8px; font-size: 20px; }
  #controls button { font: inherit; font-size: 18px; padding: 4px 12px; margin: 4px; cursor: pointer; }
  #controls input { width: min(70vw, 360px); vertical-align: middle; }
  #scene { position: relative; width: min(100vw, 1100px); aspect-ratio: 1 / 1; margin: 0 auto 24px; overflow: hidden; }
  #tree { position: absolute; left: 3.5%; bottom: 0; height: 100%; width: auto; transition: filter 1.5s; user-select: none; -webkit-user-drag: none; }
  #scene.chill #tree { filter: saturate(0.6) brightness(0.97) hue-rotate(10deg); }
  #ig { position: absolute; transform-origin: 50% 50%; cursor: pointer; will-change: transform; }
  #ig .tilt { transform-origin: 50% 80%; }
  #ig img { display: block; width: 100%; height: auto; transform-origin: 70% 100%; user-select: none; -webkit-user-drag: none;
            filter: drop-shadow(2px 4px 3px rgba(0, 0, 0, 0.35)); }
  #ig.bob img { animation: bob 1.6s ease-in-out infinite; }
  #ig.slow img { animation: bob 5s ease-in-out infinite; filter: saturate(0.35) brightness(0.92) drop-shadow(2px 4px 3px rgba(0, 0, 0, 0.35)); }
  #ig.cold img { filter: saturate(0.25) brightness(0.9) hue-rotate(25deg) drop-shadow(2px 4px 3px rgba(0, 0, 0, 0.35)); }
  @keyframes bob { 0%, 100% { transform: rotate(0deg) translateY(0); } 25% { transform: rotate(-2.5deg) translateY(-1.5%); }
                   50% { transform: rotate(0deg) translateY(0); } 70% { transform: rotate(-1.5deg) translateY(-1%); } }
  .flake { position: absolute; top: -5%; color: #8fbcf2; text-shadow: 0 0 1px #4a7fc0; font-size: 28px; pointer-events: none; animation: snow linear forwards; }
  @keyframes snow { to { transform: translateY(115vh) rotate(200deg); } }
  #marquee { overflow: hidden; white-space: nowrap; height: 1.4em; font-size: 24px; font-weight: bold; color: var(--yes); visibility: hidden; }
  #marquee span { display: inline-block; padding-left: 100%; animation: scroll 9s linear infinite; }
  #marquee.on { visibility: visible; }
  @keyframes scroll { to { transform: translateX(-100%); } }
  /* Added for areiguanasfallinginflorida.com: snow falls over the screen without lengthening the page */
  .flake { position: fixed; }
  #scene { margin-bottom: 8px; }
  /* short landscape screens (phones held sideways): words and controls on the left, scene on the right */
  @media (orientation: landscape) and (max-height: 560px) {
    body { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr; column-gap: 12px; height: 100vh; height: 100dvh; overflow: hidden; }
    #marquee { grid-column: 1 / -1; }
    h1, #answer, #say, #controls { grid-column: 1; }
    h1 { font-size: clamp(16px, 3.4vw, 28px); margin-top: 6px; }
    #answer { font-size: clamp(48px, 22vh, 140px); }
    #say { font-size: 15px; }
    #controls { font-size: 15px; }
    #scene { grid-column: 2; grid-row: 2 / span 5; align-self: end; margin: 0 8px 0 0; }
  }
  /* Added for areiguanasfallinginflorida.com: calmer for visitors who ask for reduced motion */
  @media (prefers-reduced-motion: reduce) {
    #answer.yes { animation: none; }
    #marquee span { animation: none; padding-left: 0; }
    .flake { display: none; }
    #ig.bob img, #ig.slow img { animation: none; }
  }
</style>
</head>

(() => {
  // Layout in fractions of the scene: where the iguana perches, where it lands, and the trunk it climbs.
  const L = window.LAYOUT = {
    w: 0.26, left: 0.485, top: 0.405, tilt: -8,       // on the limb that runs right from the trunk
    land: { cx: 0.72, cy: 0.955, rot: -498 },       // belly up beside the foot of the tree (rot + tilt = -506)
    trunk: { cx: 0.49, base: 0.92, top: 0.62 }      // the trunk it scrambles back up
  };
  const ig = document.getElementById("ig"), scene = document.getElementById("scene"), tilt = ig.querySelector(".tilt");
  const slider = document.getElementById("temp"), tval = document.getElementById("tval");
  const ans = document.getElementById("answer"), say = document.getElementById("say"), mq = document.getElementById("marquee");
  const FALL_AT = 44, SLUG_AT = 55, BACK_AT = 50;
  let state = "perched", busy = false, snowTimer = null, sweep = null;

  function place() {
    ig.style.width = L.w * 100 + "%"; ig.style.left = L.left * 100 + "%"; ig.style.top = L.top * 100 + "%";
    tilt.style.transform = `rotate(${L.tilt}deg)`;
  }
  window.relayout = place;
  function px(cx, cy) {   // translation that puts the iguana's centre at scene fractions (cx, cy)
    const W = scene.clientWidth, H = scene.clientHeight;
    const w = L.w * W, h = w * 0.667;
    return [cx * W - (L.left * W + w / 2), cy * H - (L.top * H + h / 2)];
  }
  function snow(on) {
    clearInterval(snowTimer);
    if (!on) return;
    snowTimer = setInterval(() => {
      const f = document.createElement("span");
      f.className = "flake"; f.textContent = Math.random() < 0.5 ? "*" : "❄";
      f.style.left = Math.random() * 100 + "%"; f.style.animationDuration = 3 + Math.random() * 4 + "s";
      f.style.fontSize = 16 + Math.random() * 26 + "px";
      document.body.appendChild(f); setTimeout(() => f.remove(), 7500);
    }, 140);
  }
  function words(t) {
    if (state === "fallen") return ["YES.", "yes", `${t}°F. They let go. They're not dead, just very, very cold. Leave them be.`];
    if (t <= SLUG_AT) return ["NOT YET.", "maybe", `${t}°F. Iguanas are getting sluggish. Hold on, buddy.`];
    return ["NO.", "", `${t}°F. Iguanas are basking, bobbing and doing fine.`];
  }
  function render() {
    const t = +slider.value; tval.textContent = t;
    const [a, cls, line] = words(t);
    ans.textContent = a; ans.className = cls; say.textContent = line;
    mq.classList.toggle("on", state === "fallen");
    scene.classList.toggle("chill", t <= SLUG_AT);
    if (state === "perched" && !busy) ig.className = t <= SLUG_AT ? "slow" : "bob";
  }
  async function fall() {
    if (busy || state !== "perched") return;
    busy = true; ig.className = "cold"; snow(true);
    const [dx, dy] = px(L.land.cx, L.land.cy), r = L.land.rot;
    const anim = ig.animate([
      { transform: "translate(0,0) rotate(0deg)" },
      { transform: "translate(-4px,0) rotate(-1deg)", offset: 0.06 }, { transform: "translate(4px,0) rotate(1deg)", offset: 0.12 },
      { transform: "translate(-4px,0) rotate(-1deg)", offset: 0.18 }, { transform: "translate(4px,0) rotate(1deg)", offset: 0.24 },
      { transform: "translate(0,6px) rotate(-28deg)", offset: 0.34, easing: "cubic-bezier(.55,0,1,.45)" },
      { transform: `translate(${dx * 0.9}px,${dy}px) rotate(${r}deg)`, offset: 0.78, easing: "ease-out" },
      { transform: `translate(${dx * 0.95}px,${dy - 40}px) rotate(${r - 18}deg)`, offset: 0.86, easing: "ease-in" },
      { transform: `translate(${dx}px,${dy}px) rotate(${r}deg)`, offset: 1 }
    ], { duration: 2600, fill: "forwards" });
    await anim.finished;
    state = "fallen"; busy = false; render();
    sweep = ig.animate([{ transform: `translate(${dx}px,${dy}px) rotate(${r}deg)` }, { transform: `translate(${dx}px,${dy}px) rotate(${r - 3}deg)` },
                        { transform: `translate(${dx}px,${dy}px) rotate(${r}deg)` }], { duration: 900, iterations: Infinity, delay: 600 });
    if (+slider.value > BACK_AT) climb();
  }
  async function climb() {
    if (busy || state !== "fallen") return;
    busy = true; snow(false); if (sweep) sweep.cancel();
    const [dx, dy] = px(L.land.cx, L.land.cy), r = L.land.rot;
    const [bx, by] = px(L.trunk.cx, L.trunk.base), [tx, ty] = px(L.trunk.cx, L.trunk.top);
    ig.getAnimations().forEach(a => a.cancel());
    const up = (f) => [bx + (tx - bx) * f, by + (ty - by) * f];
    const anim = ig.animate([
      { transform: `translate(${dx}px,${dy}px) rotate(${r}deg)` },
      { transform: `translate(${dx}px,${dy - 30}px) rotate(-720deg)`, offset: 0.16 },
      { transform: `translate(${bx}px,${by}px) rotate(-650deg)`, offset: 0.32 },
      { transform: `translate(${up(0.3)[0] - 6}px,${up(0.3)[1]}px) rotate(-640deg)`, offset: 0.44 },
      { transform: `translate(${up(0.55)[0] + 6}px,${up(0.55)[1]}px) rotate(-655deg)`, offset: 0.56 },
      { transform: `translate(${up(0.8)[0] - 6}px,${up(0.8)[1]}px) rotate(-640deg)`, offset: 0.68 },
      { transform: `translate(${tx}px,${ty}px) rotate(-660deg)`, offset: 0.8 },
      { transform: "translate(0,0) rotate(-720deg)", offset: 1 }
    ], { duration: 2600, fill: "forwards", easing: "ease-in-out" });
    await anim.finished;
    anim.cancel(); state = "perched"; busy = false; render();
    if (+slider.value <= FALL_AT) fall();
  }
  function tick() {
    render();
    const t = +slider.value;
    if (t <= FALL_AT) fall(); else if (t > BACK_AT) climb();
  }
  let rampTimer = null;
  function ramp(target, ms) {   // one ramp at a time: a new button press replaces the old one
    clearTimeout(rampTimer);
    const step = () => {
      const t = +slider.value;
      if (t === target) return;
      slider.value = t + Math.sign(target - t); tick();
      rampTimer = setTimeout(step, ms);
    };
    step();
  }
  slider.addEventListener("input", tick);
  slider.addEventListener("pointerdown", () => clearTimeout(rampTimer));
  document.getElementById("cold").onclick = () => ramp(38, 70);
  document.getElementById("warm").onclick = () => ramp(75, 60);
  ig.onclick = () => { if (state === "fallen") say.textContent = "Don't pick it up. It's fine. It's just cold."; };
  place(); render();

  /* Added for areiguanasfallinginflorida.com:
     - the square scene shrinks to fit the screen (width and the height left under the text)
     - ?t=38 in the address starts at that temperature, so the page opens on tonight's forecast */
  function fit() {
    const side = matchMedia("(orientation: landscape) and (max-height: 560px)").matches;
    const top = side ? document.getElementById("marquee").getBoundingClientRect().bottom : scene.getBoundingClientRect().top + window.scrollY;
    const room = window.innerHeight - top - 10;
    const size = Math.max(150, Math.min(side ? window.innerWidth * 0.5 : window.innerWidth, 1100, room));
    scene.style.width = size + "px";
  }
  fit();
  window.addEventListener("resize", () => {
    fit();
    if (state === "fallen" && !busy) {   // re-seat a fallen iguana at the new size
      ig.getAnimations().forEach(a => a.cancel()); state = "perched"; busy = false; render(); tick();
    }
  });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const a = Element.prototype.animate;   // jump straight to the end of each move; skip endless wiggles
    Element.prototype.animate = function (k, o) {
      if (o && o.iterations === Infinity) return { cancel() {}, finished: Promise.resolve() };
      return a.call(this, k, Object.assign({}, o, { duration: 1, delay: 0 }));
    };
  }
  const t0 = parseInt(new URLSearchParams(location.search).get("t"), 10);
  if (t0 >= 30 && t0 <= 85) { slider.value = t0; tick(); }
})();
</script>
</body>
</html>
